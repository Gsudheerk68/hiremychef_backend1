services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hmc_user
      POSTGRES_PASSWORD: hmc_pass
      POSTGRES_DB: hire_my_chef
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hmc_user -d hire_my_chef"]
      interval: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://hmc_user:hmc_pass@db:5432/hire_my_chef
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: [".:/code"]
volumes:
  pgdata:
